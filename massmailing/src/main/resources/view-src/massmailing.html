<!DOCTYPE html>
<html>

	<head>
		<title>{{#i18n}}massmailing.title{{/i18n}}</title>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
		<link rel="stylesheet" type="text/css" href="/presences/public/css/presences.css?v=@@VERSION"/>
		<script src="/assets/js/entcore/ng-app.js?v=@@VERSION" id="context" type="text/javascript"></script>
		<script type="text/javascript" src="/massmailing/public/dist/application.js?v=@@VERSION"></script>

		<script type="text/ng-template" id="empty"></script>
		<script>
			var structures = [
				{{#structures}}
					"{{id_etablissement}}",
				{{/structures}}
			];
		</script>
	</head>
	<body ng-controller="MainController as vm" class="presences massmailing">
		<portal>
			<sniplet template="memento" application="viescolaire"></sniplet>
			<sniplet template="navigation" application="presences"></sniplet>
			<container template="main"></container>
		</portal>
		<!-- Bascule permanente ancienne / nouvelle interface (ui-fab.js générique, identique dans chaque module à double interface). -->
	<script type="text/javascript" src="/massmailing/public/ui-fab.js?v=@@VERSION"></script>
</body>

</html>
