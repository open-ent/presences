name: dev-check-repository

# Contrôle de build à chaque push, en UN SEUL job (comme build.sh local : gulp puis maven dans
# le même workspace, sans handoff d'artefact — évite « frontend-assets not found » quand la sortie
# gulp n'atterrit pas dans src/main/resources/). Remplace le legacy Gradle. CCTP 51C — CI.
on: [push]

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build (Gulp + Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend (Gulp via Node 10 en Docker)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            --user root \
            opendigitaleducation/node:10-alpine \
            sh -c "npm install --legacy-peer-deps && node_modules/gulp/bin/gulp.js build"

      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: temurin
          cache: maven

      - name: Configure Maven pour GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>$GITHUB_ACTOR</username>
                <password>$GITHUB_TOKEN</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>github-packages</id>
                <repositories>
                  <repository>
                    <id>github</id>
                    <name>GitHub open-ent Packages</name>
                    <url>https://maven.pkg.github.com/open-ent/entcore-v2</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>github-packages</activeProfile>
            </activeProfiles>
          </settings>
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Build fat JAR (Maven)
        run: mvn clean package -Dmaven.test.skip=true -B -DbuildNumber=${GITHUB_SHA::8} -DscmBranch=${GITHUB_REF_NAME}
