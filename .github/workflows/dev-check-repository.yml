name: dev-check-repository

# Contrôle de build à chaque push : frontend (Gulp via Node 10 en Docker, --legacy-peer-deps)
# + backend (Maven/JDK 8, package). Remplace l'ancien workflow legacy (Node 10 direct + Gradle)
# qui échouait systématiquement (projet Maven, pas Gradle). CCTP 51C — CI.
# NB : build sans compilation des tests (-Dmaven.test.skip=true) car org.entcore:tests:<v>-patched
# n'est pas publié dans les repos (DependencyResolutionException sinon).
on: [push]

permissions:
  contents: read
  packages: read

jobs:
  frontend:
    name: Build Frontend (Gulp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with Node 10 via Docker
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            --user root \
            opendigitaleducation/node:10-alpine \
            sh -c "npm install --legacy-peer-deps && node_modules/gulp/bin/gulp.js build"

      - name: Upload frontend assets
        uses: actions/upload-artifact@v4
        with:
          name: frontend-assets
          path: src/main/resources/
          retention-days: 1

  backend:
    name: Build (Maven)
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: temurin
          cache: maven

      - name: Configure Maven pour GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>$GITHUB_ACTOR</username>
                <password>$GITHUB_TOKEN</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>github-packages</id>
                <repositories>
                  <repository>
                    <id>github</id>
                    <name>GitHub open-ent Packages</name>
                    <url>https://maven.pkg.github.com/open-ent/entcore-v2</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>github-packages</activeProfile>
            </activeProfiles>
          </settings>
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Download frontend assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-assets
          path: src/main/resources/

      - name: Build fat JAR
        run: mvn clean package -Dmaven.test.skip=true -B -DbuildNumber=${GITHUB_SHA::8} -DscmBranch=${GITHUB_REF_NAME}
