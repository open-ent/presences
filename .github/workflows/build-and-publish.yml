name: Build & Publish Fat Mods

on:
  push:
    branches: [main, master, develop]
    tags: ['*']
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  frontend:
    name: Build Frontend (Gulp)
    runs-on: ubuntu-latest
    container:
      image: opendigitaleducation/node:10-alpine
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Build with Gulp
        run: node_modules/gulp/bin/gulp.js build

      - name: Upload frontend assets
        uses: actions/upload-artifact@v4
        with:
          name: frontend-assets
          path: |
            presences/src/main/resources/
            common/src/main/resources/
            incidents/src/main/resources/
            massmailing/src/main/resources/
            statistics-presences/src/main/resources/
          retention-days: 1

  backend:
    name: Build & Publish Fat Mods
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: temurin
          cache: maven

      - name: Download frontend assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-assets
          path: .

      - name: Build all fat JARs
        run: mvn clean package -DskipTests -B

      - name: Run tests
        if: github.event_name == 'pull_request'
        run: mvn test -B

      - name: Configure Maven for GitHub Packages
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Publish all fat JARs to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO_URL="https://maven.pkg.github.com/${{ github.repository }}"
          for MODULE_DIR in presences common incidents massmailing statistics-presences; do
            if [ ! -f "${MODULE_DIR}/pom.xml" ]; then continue; fi
            GROUP_ID=$(mvn help:evaluate -pl "${MODULE_DIR}" -Dexpression=project.groupId -q -DforceStdout 2>/dev/null)
            ARTIFACT_ID=$(mvn help:evaluate -pl "${MODULE_DIR}" -Dexpression=project.artifactId -q -DforceStdout 2>/dev/null)
            VERSION=$(mvn help:evaluate -pl "${MODULE_DIR}" -Dexpression=project.version -q -DforceStdout 2>/dev/null)
            FAT_JAR="${MODULE_DIR}/target/${ARTIFACT_ID}-${VERSION}-fat.jar"
            if [ -f "${FAT_JAR}" ]; then
              echo "Publishing ${GROUP_ID}:${ARTIFACT_ID}:${VERSION}:fat"
              mvn deploy:deploy-file \
                -Dfile="${FAT_JAR}" \
                -DgroupId="${GROUP_ID}" \
                -DartifactId="${ARTIFACT_ID}" \
                -Dversion="${VERSION}" \
                -Dclassifier=fat \
                -Dpackaging=jar \
                -DrepositoryId=github \
                -Durl="${REPO_URL}" \
                -B
            else
              echo "Skipping ${MODULE_DIR}: fat JAR not found at ${FAT_JAR}"
            fi
          done

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            presences/target/*-fat.jar
            incidents/target/*-fat.jar
            massmailing/target/*-fat.jar
            statistics-presences/target/*-fat.jar
          generate_release_notes: true
