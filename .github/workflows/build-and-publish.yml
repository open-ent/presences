name: Build & Publish Fat Mods

on:
  push:
    branches:
      - main
      - master
      - develop
      - '*-patched'
      - '*-patched-dev'
    tags: ['*']
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      entcore_version:
        description: 'Version entcore (ex: 6.14.9-patched). Laissez vide pour utiliser la version du pom.xml.'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  frontend:
    name: Build Frontend (Gulp)
    runs-on: ubuntu-latest
    container:
      image: opendigitaleducation/node:10-alpine
      options: --user root
    steps:
      - uses: actions/checkout@v1

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Build with Gulp
        run: node_modules/gulp/bin/gulp.js build

      - name: Upload frontend assets
        uses: actions/upload-artifact@v1
        with:
          name: frontend-assets
          path: |
            presences/src/main/resources/
            common/src/main/resources/
            incidents/src/main/resources/
            massmailing/src/main/resources/
            statistics-presences/src/main/resources/

  backend:
    name: Build & Publish Fat Mods
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: temurin
          cache: maven

      - name: Configure Maven pour GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>$GITHUB_ACTOR</username>
                <password>$GITHUB_TOKEN</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>github-packages</id>
                <repositories>
                  <repository>
                    <id>github</id>
                    <name>GitHub open-ent Packages</name>
                    <url>https://maven.pkg.github.com/open-ent/entcore-v2</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>github-packages</activeProfile>
            </activeProfiles>
          </settings>
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Download frontend assets
        uses: actions/download-artifact@v1
        with:
          name: frontend-assets
          path: .

      - name: Build all fat JARs
        run: |
          ENTCORE_OPT=""
          if [ -n "$ENTCORE_VERSION" ]; then ENTCORE_OPT="-DentCoreVersion=$ENTCORE_VERSION"; fi
          mvn clean package -DskipTests -B $ENTCORE_OPT
        env:
          ENTCORE_VERSION: ${{ github.event.inputs.entcore_version }}

      - name: Run tests
        if: github.event_name == 'pull_request'
        run: mvn test -B

      - name: Publish all fat JARs to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO_URL="https://maven.pkg.github.com/${{ github.repository }}"
          for MODULE_DIR in presences common incidents massmailing statistics-presences; do
            if [ ! -f "${MODULE_DIR}/pom.xml" ]; then continue; fi
            GROUP_ID=$(mvn help:evaluate -pl "${MODULE_DIR}" -Dexpression=project.groupId -q -DforceStdout 2>/dev/null)
            ARTIFACT_ID=$(mvn help:evaluate -pl "${MODULE_DIR}" -Dexpression=project.artifactId -q -DforceStdout 2>/dev/null)
            VERSION=$(mvn help:evaluate -pl "${MODULE_DIR}" -Dexpression=project.version -q -DforceStdout 2>/dev/null)
            FAT_JAR="${MODULE_DIR}/target/${ARTIFACT_ID}-${VERSION}-fat.jar"
            if [ -f "${FAT_JAR}" ]; then
              echo "Publishing ${GROUP_ID}:${ARTIFACT_ID}:${VERSION}:fat"
              mvn deploy:deploy-file \
                -Dfile="${FAT_JAR}" \
                -DgroupId="${GROUP_ID}" \
                -DartifactId="${ARTIFACT_ID}" \
                -Dversion="${VERSION}" \
                -Dclassifier=fat \
                -Dpackaging=jar \
                -DrepositoryId=github \
                -Durl="${REPO_URL}" \
                -B
            else
              echo "Skipping ${MODULE_DIR}: fat JAR not found at ${FAT_JAR}"
            fi
          done

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            presences/target/*-fat.jar
            incidents/target/*-fat.jar
            massmailing/target/*-fat.jar
            statistics-presences/target/*-fat.jar
          generate_release_notes: true
