name: Build & Publish Fat Mods

on:
  push:
    branches:
      - main
      - master
      - develop
      - '*-patched'
      - '*-patched-dev'
    tags: ['*']
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      entcore_version:
        description: 'Version entcore (ex: 6.14.9-patched). Laissez vide pour utiliser la version du pom.xml.'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  frontend:
    name: Build Frontend (Gulp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with Node 10 via Docker
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            --user root \
            opendigitaleducation/node:10-alpine \
            sh -c "npm install --legacy-peer-deps && node_modules/gulp/bin/gulp.js build"

      - name: Upload frontend assets
        uses: actions/upload-artifact@v4
        with:
          name: frontend-assets
          path: |
            presences/src/main/resources/
            common/src/main/resources/
            incidents/src/main/resources/
            massmailing/src/main/resources/
            statistics-presences/src/main/resources/
          retention-days: 1

  backend:
    name: Build & Publish Fat Mods
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: temurin
          cache: maven

      - name: Configure Maven pour GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>$GITHUB_ACTOR</username>
                <password>$GITHUB_TOKEN</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>github-packages</id>
                <repositories>
                  <repository>
                    <id>github</id>
                    <name>GitHub open-ent Packages</name>
                    <url>https://maven.pkg.github.com/open-ent/entcore-v2</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>github-packages</activeProfile>
            </activeProfiles>
          </settings>
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Download frontend assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-assets
          path: .

      - name: Build all fat JARs
        run: |
          ENTCORE_OPT=""
          if [ -n "$ENTCORE_VERSION" ]; then ENTCORE_OPT="-DentCoreVersion=$ENTCORE_VERSION"; fi
          mvn clean package -DskipTests -B $ENTCORE_OPT
        env:
          ENTCORE_VERSION: ${{ github.event.inputs.entcore_version }}

      - name: Run tests
        if: github.event_name == 'pull_request'
        run: mvn test -B

      - name: Publish all fat JARs to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO_URL="https://maven.pkg.github.com/${{ github.repository }}"
          for FAT in $(find . -path "*/target/*-fat.jar"); do
            BASE=$(basename "${FAT}" -fat.jar)
            case "${BASE}" in *~*~*) ;; *) echo "skip ${BASE}"; continue;; esac
            FAT_ABS=$(realpath "${FAT}")
            GROUP_ID=${BASE%%~*}; REST=${BASE#*~}; ARTIFACT_ID=${REST%%~*}; VERSION=${REST#*~}
            echo "Deploying ${GROUP_ID}:${ARTIFACT_ID}:${VERSION}:fat -> rct-nexus"
            ( cd /tmp && mvn deploy:deploy-file -s /tmp/nx-settings.xml -Dfile="${FAT_ABS}" -DgroupId="${GROUP_ID}" -DartifactId="${ARTIFACT_ID}" -Dversion="${VERSION}" -Dclassifier=fat -Dpackaging=jar -DrepositoryId=pt-releases -Durl="https://rct-nexus.tech.fr/repository/maven-releases/" -B )
          done

      - name: Publish all fat JARs to rct-nexus
        continue-on-error: true
        if: startsWith(github.ref, 'refs/tags/')
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          cat > /tmp/nx-settings.xml <<EOF
          <settings><servers><server><id>pt-releases</id><username>${NEXUS_USER}</username><password>${NEXUS_PASSWORD}</password></server></servers></settings>
          EOF
          for MODULE_DIR in presences common incidents massmailing statistics-presences; do
            [ -f "${MODULE_DIR}/pom.xml" ] || continue
            GROUP_ID=$(mvn help:evaluate -pl "${MODULE_DIR}" -Dexpression=project.groupId -q -DforceStdout 2>/dev/null)
            ARTIFACT_ID=$(mvn help:evaluate -pl "${MODULE_DIR}" -Dexpression=project.artifactId -q -DforceStdout 2>/dev/null)
            VERSION=$(mvn help:evaluate -pl "${MODULE_DIR}" -Dexpression=project.version -q -DforceStdout 2>/dev/null)
            FAT_JAR="${MODULE_DIR}/target/${ARTIFACT_ID}-${VERSION}-fat.jar"
            [ -f "${FAT_JAR}" ] || { echo "skip ${MODULE_DIR} (pas de fat)"; continue; }
            cp "${FAT_JAR}" /tmp/nx.jar
            echo "Deploying ${GROUP_ID}:${ARTIFACT_ID}:${VERSION}:fat -> rct-nexus"
            ( cd /tmp && mvn deploy:deploy-file -s /tmp/nx-settings.xml -Dfile=/tmp/nx.jar -DgroupId="${GROUP_ID}" -DartifactId="${ARTIFACT_ID}" -Dversion="${VERSION}" -Dclassifier=fat -Dpackaging=jar -DrepositoryId=pt-releases -Durl="https://rct-nexus.tech.fr/repository/maven-releases/" -B )
          done

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            presences/target/*-fat.jar
            incidents/target/*-fat.jar
            massmailing/target/*-fat.jar
            statistics-presences/target/*-fat.jar
          generate_release_notes: true
